
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 20px;
            color: #333333;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website!</h1>

    <p>Hello! I made this website using Notepad.</p>

    <button onclick="alert('Hello! Welcome to my website!')">
        Click Me
    </button>

</body>
</html>
